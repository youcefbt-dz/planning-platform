# ============================================================================
# AI — which provider answers, which model, what may leave the machine.
#
# The AI layer lives in app/ai/. To add a PROVIDER drop a file in app/ai/providers/
# (see docs/AI.md); to add a TASK drop a file in app/ai/tasks/. Nothing else to edit
# except this file when you want to configure it.
#
# `chain` is tried in order; the first provider that is available AND allowed answers.
# `offline` is the built-in rule-based fallback: it needs no key, no network, and is
# always last, so every AI feature keeps working (with simpler answers) without AI.
# ============================================================================
enabled: true
chain: [openai_compat, gemini, xai, groq, anthropic, offline]   # a local model, when configured, is preferred over the cloud; then Gemini, and Grok the moment Gemini is limited or down

providers:
  gemini:                          # Google Gemini (cloud, free tier on the Flash family). Set GEMINI_API_KEY and GEMINI_MODEL in .env
    base_url: https://generativelanguage.googleapis.com/v1beta
    api_key_env: GEMINI_API_KEY
    model_env: GEMINI_MODEL             # one or several model ids, best first: "model-a,model-b". Each model has its own quota, so a limited one is skipped
                                        # at once. A Flash model one step behind the newest has looser limits than the newest. No default on purpose.
    local: false                   # data leaves the machine → needs the organization's consent
  anthropic:                       # cloud API (Claude). Set ANTHROPIC_API_KEY in .env
    api_key_env: ANTHROPIC_API_KEY
    base_url: https://api.anthropic.com
    version: "2023-06-01"
    local: false                   # data leaves the machine → needs the organization's consent
    models:
      default: claude-haiku-5-5    # cheap and fast: reading headers
      explain_reality: claude-sonnet-5-5
      agent: claude-sonnet-5-5       # the assistant needs a strong model: it plans, calls tools and checks its own figures
  groq:                            # Groq cloud (OpenAI-compatible, free tier). Set GROQ_API_KEY and GROQ_MODEL in .env
    base_url: https://api.groq.com/openai/v1
    api_key_env: GROQ_API_KEY
    model_env: GROQ_MODEL               # a model id from console.groq.com/docs/models; there is deliberately no default
    key_required: true
    local: false                   # data leaves the machine → needs the organization's consent
  xai:                             # Grok (cloud, OpenAI-compatible). Set XAI_API_KEY and XAI_MODEL in .env
    base_url: https://api.x.ai/v1
    api_key_env: XAI_API_KEY
    model_env: XAI_MODEL                # a model name from your xAI console; there is deliberately no default
    key_required: true
    local: false                   # data leaves the machine → needs the organization's consent
  openai_compat:                   # LOCAL model: Ollama, LM Studio, vLLM, llama.cpp… (OpenAI-compatible API)
    base_url_env: AI_LOCAL_BASE_URL     # e.g. http://localhost:11434/v1
    api_key_env: AI_LOCAL_API_KEY       # optional
    model_env: AI_LOCAL_MODEL           # e.g. qwen2.5:14b-instruct
    local: true                    # data stays on the company's own machine → no consent needed
    models:
      default: qwen2.5:14b-instruct

tasks:
  map_columns:     {enabled: true, max_tokens: 6000, temperature: 0}
  explain_reality: {enabled: true, max_tokens: 1200, temperature: 0.2}
  review_goal:     {enabled: true, max_tokens: 1200, temperature: 0.2}     # coaches how a goal is written (rules run first)
  suggest_krs:     {enabled: true, max_tokens: 900,  temperature: 0}       # picks which uploaded series measures an objective
  draft_justification: {enabled: true, max_tokens: 900, temperature: 0.2}  # writes the justification of an ambitious target
  summarize_health: {enabled: true, max_tokens: 900, temperature: 0.2}     # the weekly brief on goal health
  draft_goal:      {enabled: true, max_tokens: 1100, temperature: 0.5}     # from one typed line to objective + why + key results (no figures)
  agent:           {enabled: true, max_tokens: 2200, temperature: 0.2}     # the assistant: a conversation with tools (app/modules/agent)
  draft_direction: {enabled: true, max_tokens: 900,  temperature: 0.6}     # vision / mission / values options from the sector (nothing is saved)
  explain_journey:  {enabled: true, max_tokens: 1800, temperature: 0.25}   # spoken, data-grounded explanation of the organization map
  ask_journey:      {enabled: true, max_tokens: 900, temperature: 0.2}     # answer a spoken question about the live organization map

privacy:
  sample_rows: 8                   # how many example rows may be sent (headers + these only, never the whole file)
  max_cell_chars: 60               # longer cells are cut before sending
  require_consent: true            # external (cloud) providers need the organization's explicit consent
  external_calls_per_org_per_day: 400   # one assistant turn makes several calls
  timeout_seconds: 45
