concept:
  delivery: "نسبة الطلبات التي وصلت في موعدها. مؤشر جودة خدمة: كلما ارتفعت كان أفضل. هي نسبة جاهزة، فلا تُجمع بين الصفوف بل يُؤخذ متوسطها."
  margin: "حصة الربح من الإيراد. تبيّن قدرة النشاط على تحويل المبيعات إلى ربح، وهي أصدق من الربح المطلق عند مقارنة فروع مختلفة الحجم. لا تُجمع بين الصفوف."
  profit: "ما يتبقى بعد خصم التكاليف من الإيراد. هو الحكم النهائي على جدوى النشاط؛ ارتفاعه تحسّن وانخفاضه إنذار."
  revenue: "قيمة ما حصّلته المؤسسة من عملائها في كل فترة. هو أساس قياس النمو، ويُقارَن بالتكاليف لمعرفة الهامش."
  sales: "قيمة المبيعات المسجلة في كل صف. ارتفاعها يعني نشاطًا تجاريًا أكبر، وتفكيكها حسب الفرع أو المنتج يكشف أين يأتي النمو."
  cost: "ما أنفقته المؤسسة لإنتاج ما بيع أو تقديمه في الفترة. إن ارتفعت أسرع من الإيراد ضغطت على الربح؛ لذلك انخفاضها هو التحسّن."
  expense: "مصاريف التشغيل المسجلة في الفترة (إدارة، تسويق، نقل…). خفضها مع ثبات الإيراد يحسّن النتيجة."
  salary: "كلفة الأجور في الفترة. تُقرأ مع عدد العاملين والإيراد لمعرفة إنتاجية كل عامل."
  headcount: "عدد العاملين في تاريخ القراءة. هو رصيد وليس تدفقًا، فنأخذ آخر قيمة في الشهر لا مجموع الصفوف."
  orders: "عدد الطلبات المستلمة في الفترة. يقيس حجم النشاط بمعزل عن قيمة الطلب الواحد، ويفسّر هل تغيّر الإيراد بسبب العدد أم السعر."
  quantity: "عدد الوحدات التي بيعت أو أُنتجت في الفترة. يفصل أثر الحجم عن أثر السعر عند تفسير تغيّر الإيراد."
  stock: "حجم المخزون في تاريخ القراءة. رصيد وليس تدفقًا، فنأخذ آخر قيمة في الشهر؛ ارتفاعه المفرط يعني أموالًا مجمّدة."
  balance: "رصيد في تاريخ القراءة وليس مجموع حركة، فنأخذ آخر قيمة في الشهر لا مجموع الصفوف."
  price: "سعر الوحدة. لا يُجمع بين الصفوف، ويؤخذ متوسطه."
  rate: "نسبة أو معدل محسوب مسبقًا. لا تُجمع النسب بين الصفوف بل يُؤخذ متوسطها."
reality:
  span:
    zero: لا شيء
    one: شهر واحد
    two: شهرين
    few: "{n} أشهر"
    many: "{n} شهرًا"
    other: "{n} شهر"
  summary:
    realistic: "التغيير المطلوب ({required}) خلال {span} يقع ضمن النطاق المسجل؛ كان التغيير المعتاد خلال {span} هو {median}، وأفضل نتيجة {best}."
    ambitious: "المطلوب ({required}) خلال {span} أعلى من التغيير المعتاد ({median})، لكنه يقترب من مستويات سبق تسجيلها ({p90} أو أكثر)."
    stretch: "المطلوب ({required}) خلال {span} يقترب من أفضل تغيير مسجل في فترة مماثلة مدتها {span} ({best}) أو يتجاوزه."
    unrealistic: "المطلوب ({required}) خلال {span} يتجاوز أفضل تغيير مسجل في فترة مماثلة ({best}) بفارق واضح؛ ولا تدعمه البيانات الحالية."
    insufficient: "لا تكفي البيانات للحكم على المستهدف؛ تتوفر {points} نقطة فقط، ولا يمكن مقارنة فترات مماثلة مدتها {span}."
  reason:
    history: "في {windows} فترة مماثلة مدتها {span}، بلغ التغيير المعتاد {median} وأعلى تغيير {best}. يتجاوز مستهدفك {percentile}% من هذه الفترات."
  note:
    short_history: لا تغطي البيانات عامين كاملين؛ لذلك لم يُفحص أثر الموسمية.
    few_windows: الفترات المماثلة قليلة، فخذ المقارنة بحذر.
    flat_history: لم يتغير المؤشر كثيرًا في السجل السابق؛ وأي تغيير كبير يحتاج إلى عامل إضافي.
    declining_trend: الاتجاه في القراءات الأخيرة لا يدعم بلوغ المستهدف.
    volatile: تتذبذب قيم المؤشر بشدة؛ لذلك لا تكفي قراءة شهر واحد للاستنتاج.
    seasonal_end: يقع تاريخ النهاية في شهر يختلف أداؤه عادةً عن متوسط السنة.
    negative_values: تتضمن السلسلة أصفارًا أو قيمًا سالبة؛ لذلك استُخدمت فروق القيم بدل نسب التغير.
    start_differs: قيمة البداية المدخلة لا تطابق آخر قراءة في البيانات.
    scale_mismatch: "وحدة المستهدف أو حجمه لا يتوافق مع آخر قراءة ({latest}). راجع الوحدة والقيمة المدخلة."
    already_met: بلغت القيمة الحالية المستهدف أو تجاوزته.
  suggest:
    keep: أبقِ المستهدف، وحدّث المؤشر شهريًا لمتابعة التقدم.
    lower: "راجع مستهدفًا قرب {value}، أو سجّل العامل الذي سيغيّر مستوى الأداء المتوقع."
    more_data: أضف بيانات تغطي 24 شهرًا على الأقل قبل الاعتماد على مقارنة موسمية.
  the_series: هذا المؤشر
  action:
    higher: "رفع {name}"
    lower: "خفض {name}"
  ratio_tail: "، أي نحو {ratio} ضعف أفضل أداء لك"
  beat:
    all: يفوق كلها
    some: "يفوق {percentile}% منها"
  s:
    realistic: "يتطلب {action} من {from} إلى {to} خلال {span} تغييرًا قدره {required}؛ وهو ضمن التغيير المعتاد في السجل ({median})."
    ambitious: "يتطلب {action} من {from} إلى {to} خلال {span} تغييرًا قدره {required}، وهو أعلى من المعتاد ({median}) وأقل من أفضل نتيجة مسجلة ({best})."
    stretch: "يتطلب {action} من {from} إلى {to} خلال {span} تغييرًا قدره {required}، وهو قريب من أفضل نتيجة مسجلة في فترة مماثلة ({best}) أو يتجاوزها."
    unrealistic: "يتطلب {action} من {from} إلى {to} خلال {span} تغييرًا قدره {required}، بينما أفضل تغيير مسجل هو {best}{ratio_tail}."
    insufficient: "لا تكفي القراءات المتاحة للحكم على «{name}»: توجد {points} نقطة فقط، ولا يمكن مقارنة فترات مماثلة مدتها {span}."
  r:
    history: "في {windows} فترة مماثلة مدتها {span}، بلغ التحسّن المعتاد {median} وأعلى تحسّن {best}؛ ومستهدفك {beat}."
    pace: "يتطلب المستهدف تغييرًا شهريًا قدره {m_req}، مقابل متوسط شهري سابق قدره {m_typ}."
  a:
    keep: "أبقِ المستهدف وراجع المؤشر شهريًا؛ يتطلب بلوغه تغييرًا شهريًا قدره {m_req}."
    ambitious: "اعتمد المستهدف إذا وُجد إجراء محدد يبرر تجاوز الأداء المعتاد ({typical})؛ وإلا فاحتفظ بـ{to} كمستهدف تطلّعي."
    cut: "اجعل المستهدف المعتمد قرب {high}، واحتفظ بـ{to} كمستهدف تطلّعي إلى أن يتوفر إجراء موثّق يسنده."
  q:
    capacity: هل ستنمو الطاقة الإنتاجية أو عدد العاملين بما يكفي لتحقيقه؟
    price: هل يوجد تغيير في الأسعار أو عرض جديد يفسّر هذه القفزة؟
    market: هل هناك سوق أو فرع أو عميل جديد لم يكن في بيانات السنة الماضية؟
    season: هل تقع نهاية الفترة في موسم يكون فيه الطلب قويًا أو ضعيفًا عادةً؟
    change: ما الذي سيتغيّر في الأشهر القادمة ولم يكن موجودًا في تاريخك؟
