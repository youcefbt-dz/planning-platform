reality:
  span:
    zero: لا شيء
    one: شهر واحد
    two: شهرين
    few: "{n} أشهر"
    many: "{n} شهرًا"
    other: "{n} شهر"
  summary:
    realistic: "تغيّر قدره {required} خلال {span} يقع ضمن ما يُظهره تاريخك: التغيّر المعتاد خلال {span} كان {median}، وأفضل تغيّر {best}."
    ambitious: "تغيّر قدره {required} خلال {span} طموح. هو أعلى من تغيّرك المعتاد ({median})، لكن تاريخك بلغ {p90} أو أكثر."
    stretch: "تغيّر قدره {required} خلال {span} تحدٍّ كبير: يقترب من أفضل تغيّر حققته خلال {span} ({best}) أو يتجاوزه."
    unrealistic: "تغيّر قدره {required} خلال {span} يفوق بكثير كل ما في تاريخك (الأفضل: {best}). ما لم يتغيّر شيء جوهري فهو بعيد الاحتمال."
    insufficient: "لا يكفي التاريخ للحكم على هذا المستهدف. {points} نقاط بيانات لا تسمح بمقارنة فترات مماثلة مدتها {span}."
  reason:
    history: "عبر {windows} فترة مماثلة مدتها {span}، كان التغيّر المعتاد {median} وأفضله {best}. مستهدفك أعلى من {percentile}% منها."
  note:
    short_history: التاريخ أقل من سنتين، فلم يمكن فحص الموسمية.
    few_windows: الفترات المماثلة قليلة، فخذ المقارنة بحذر.
    flat_history: السلسلة بالكاد تحرّكت، فأي تغيّر كبير بعيد جدًا عن سلوكها السابق.
    declining_trend: الاتجاه الأخير يبتعد عن الهدف.
    volatile: السلسلة شديدة التذبذب، فلا يدل شهر واحد على الكثير.
    seasonal_end: تاريخ النهاية يقع في شهر يكون عادةً قويًا أو ضعيفًا لهذه السلسلة.
    negative_values: في السلسلة أصفار أو قيم سالبة، فاعتُمدت التغيّرات المطلقة.
    start_differs: قيمة البداية التي أدخلتها تختلف عن آخر قيمة في البيانات.
    scale_mismatch: "المستهدف والسلسلة على مقياسين مختلفين جدًا (آخر قيمة {latest}). تحقق من الوحدة ومن الرقم الذي أدخلته."
    already_met: القيمة الحالية بلغت هذا المستهدف أو تجاوزته أصلًا.
  suggest:
    keep: المستهدف متّسق مع تاريخك. أبقِه وتابعه شهريًا.
    lower: "فكّر في مستهدف قرب {value}، أو وضّح ما الذي سيتغيّر ليصبح المستهدف الأعلى ممكنًا."
    more_data: استورد تاريخًا أطول (يفضّل 24 شهرًا فأكثر) للحصول على حكم حقيقي.
  the_series: هذا المؤشر
  action:
    higher: "رفع {name}"
    lower: "خفض {name}"
  ratio_tail: "، أي نحو {ratio} ضعف أفضل أداء لك"
  beat:
    all: يفوق كلها
    some: "يفوق {percentile}% منها"
  s:
    realistic: "{action} من {from} إلى {to} خلال {span} هدف واقعي: يتطلب تحسّنًا قدره {required}، والمعتاد في تاريخك {median}."
    ambitious: "{action} من {from} إلى {to} خلال {span} طموح لكنه ممكن: يتطلب تحسّنًا قدره {required}، أي أكثر من معتادك ({median}) وأقل من أفضل ما بلغتَه ({best})."
    stretch: "{action} من {from} إلى {to} خلال {span} تحدٍّ كبير: يتطلب تحسّنًا قدره {required}، وهذا يقارب أفضل ما حققتَه في فترة مماثلة ({best}) أو يتجاوزه."
    unrealistic: "{action} من {from} إلى {to} خلال {span} يفوق كل ما في تاريخك: يتطلب تحسّنًا قدره {required}، بينما أفضل ما بلغتَه {best}{ratio_tail}."
    insufficient: "لا يكفي التاريخ للحكم على «{name}»: {points} نقاط بيانات لا تسمح بمقارنة فترات مماثلة مدتها {span}."
  r:
    history: "في {windows} فترة مماثلة مدتها {span} كان التحسّن المعتاد {median} وأفضله {best}؛ ومستهدفك {beat}."
    pace: "الوتيرة المطلوبة {m_req} كل شهر، بينما كانت وتيرتك المعتادة {m_typ}."
  a:
    keep: "أبقِ المستهدف كما هو وتابعه شهريًا؛ الوتيرة المطلوبة {m_req} كل شهر، وأي تأخر عنها سيظهر مبكرًا."
    ambitious: "أبقِه إن كان لديك سبب محدد لتجاوز المعتاد. وإن لم يكن، فاجعل المستوى المعتاد ({typical}) أساسًا واعتبر {to} هدفًا تطلّعيًا."
    cut: "اجعل المستهدف الملتزَم به قرب {high}، وأبقِ {to} هدفًا تطلّعيًا لا يُحاسَب عليه إلا إذا سجّلتَ رافعة مؤكَّدة تسنده."
  q:
    capacity: هل ستنمو الطاقة الإنتاجية أو عدد العاملين بما يكفي لتحقيقه؟
    price: هل يوجد تغيير في الأسعار أو عرض جديد يفسّر هذه القفزة؟
    market: هل هناك سوق أو فرع أو عميل جديد لم يكن في بيانات السنة الماضية؟
    season: هل تقع نهاية الفترة في موسم يكون فيه الطلب قويًا أو ضعيفًا عادةً؟
    change: ما الذي سيتغيّر في الأشهر القادمة ولم يكن موجودًا في تاريخك؟
