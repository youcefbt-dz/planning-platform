capabilities:
  eyebrow: ما الذي تجمعه المنصة؟
  title: أدوات مترابطة، لكل منها وظيفة واضحة.
  text: المكوّنات الأساسية في النسخة الحالية تعمل معًا لتقليل التشتت بين الأهداف والبيانات والمتابعة والتقارير.
  goals:
    title: الأهداف والنتائج الرئيسية
    text: أنشئ أهدافًا قابلة للقياس، واربطها بنتائج رئيسية ومسؤولين ودورات متابعة.
  indicators:
    title: مؤشرات الأداء
    text: سجّل القيم دوريًا، وقارنها بالمستهدف، وتابع الاتجاه والحالة عبر الزمن.
  data:
    title: ملفات البيانات والتحليل
    text: استورد ملفاتك، وافحص جودة البيانات، واربط الأعمدة بالسلاسل والمؤشرات.
  map:
    title: مخطط المؤسسة
    text: اعرض العلاقة بين المؤسسة وأهدافها ومؤشراتها، وتعرّف على الفجوات والفروع التي تحتاج إلى مراجعة.
  reports:
    title: التقارير والتصدير
    text: أنشئ تقارير التقدّم والمؤشرات وملف المؤسسة، واطبعها أو صدّر البيانات المتاحة.
  teams:
    title: الوحدات والصلاحيات
    text: نظّم العمل بحسب الوحدات التنظيمية، ووزّع المسؤوليات، واضبط ما يستطيع كل دور مشاهدته أو تعديله.

ai:
  eyebrow: ذكاء اصطناعي داخل سير العمل
  title: مساعد يفهم سياق التخطيط، ويترك القرار لك.
  text: يساعدك على تجاوز الصفحة البيضاء، ومراجعة صياغة الأهداف، وفهم ما تقوله بياناتك. الاقتراحات نقطة بداية قابلة للتعديل وليست قرارات تُطبّق تلقائيًا.
  task_one: اقتراح صيغ للرؤية والأهداف والنتائج الرئيسية.
  task_two: مراجعة الهدف وتوضيح ما يحتاج إلى تحسين.
  task_three: المساعدة في قراءة البيانات وشرح الأداء والفجوات.
  privacy: يمكنك إعداد مزوّد محلي أو سحابي. ولا يُستخدم المزوّد السحابي إلا بعد موافقة المؤسسة؛ كما تبقى القواعد المدمجة خيارًا احتياطيًا عند عدم إعداد نموذج.
  visual_one: صياغة الأهداف
  visual_two: تحليل البيانات
  visual_three: قراءة الأداء

