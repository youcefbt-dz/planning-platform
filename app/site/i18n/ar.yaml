promises:
  align:
    title: اربط أهداف الأقسام بأهداف المؤسسة
    text: يظهر ارتباط كل هدف بالهدف الأعلى منه، من مستوى المؤسسة إلى القسم والفريق.
  follow:
    title: تابع التقدّم من سجل واحد
    text: تُحدّث النتائج في سجل واحد، وتُحسب حالتها بمقارنة التقدّم الفعلي بالوقت المنقضي. تظهر النتائج المتأخرة للمراجعة.
  decide:
    title: راجع الأداء استنادًا إلى البيانات
    text: تعرض لوحة البيانات قيم المؤشرات واتجاهاتها ومساهمات الفروع، وتُصدر تقارير الأهداف والمبادرات بصيغ قابلة للطباعة وCSV.

showcase:
  first:
    title: تسلسل واضح للأهداف والنتائج الرئيسية
    text: حوّل أهداف المؤسسة إلى أهداف للأقسام، وحدّد لكل هدف نتائج رئيسية بقيمة بداية ومستهدف. يُحتسب التقدّم عبر المستويات.
    a: شجرة مواءمة من المؤسسة نزولًا إلى كل فريق
    b: نتائج رئيسية موزونة بقيمة بداية ومستهدف
    c: حالة مشتقّة من التقويم بحدود يمكنك تعديلها
    alt: صفحة هدف مع نتائجه الرئيسية وسجلّ التقدّم
  second:
    title: تابع المبادرات ومراحل التنفيذ
    text: اربط كل مبادرة بالأهداف التي تدعمها، وحدّد مسؤولًا ومواعيد ومعالم، ثم راقب حالتها على لوحة أو جدول زمني.
    a: "لوحة حسب الوضع: مخطَّطة ونشطة ومعلَّقة ومكتملة"
    b: خارطة طريق بالمعالم وعلامة لليوم الحالي
    c: كل مبادرة مرتبطة بالأهداف التي تدعمها
    alt: خارطة طريق المبادرات مع المعالم

features:
  title: وحدات التخطيط والمتابعة
  text: فعّل الوحدات التي تحتاجها المؤسسة، وأدر الأهداف والبيانات والمبادرات من مساحة عمل واحدة.
  okr:
    title: الأهداف والنتائج الرئيسية
    text: أنشئ أهدافًا على مستوى المؤسسة والأقسام، وحدّد لكل هدف نتائج رئيسية وأوزانًا ودورة متابعة.
  kpi:
    title: المؤشرات
    text: سجّل مؤشرات الأداء دوريًا، وقارن قراءاتها بالمستهدف، واعرض اتجاهها في رسوم وجداول.
  initiatives:
    title: المبادرات والمعالم
    text: "حدّد إجراءات تنفيذ الأهداف في مبادرات، مع مسؤول ومواعيد ومعالم وتحديثات للحالة."
  map:
    title: خريطة الاستراتيجية
    text: صنّف أهداف المؤسسة ضمن المنظورات الأربعة لبطاقة الأداء المتوازن، وحدّد علاقات التأثير بينها.
  modular:
    title: وحدات قابلة للتركيب
    text: فعّل الوحدات التي تحتاجها المؤسسة، ويمكن توسيع المنصة بوحدات مستقلة.
  lang:
    title: عربية أولاً
    text: واجهة عربية باتجاه من اليمين إلى اليسار، مع مصطلحات موحّدة للأهداف والمؤشرات والتخطيط.

