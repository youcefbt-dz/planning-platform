promises:
  align:
    title: اربط كل هدف بالاستراتيجية
    text: تضع الفرق أهدافها تحت أهداف المؤسسة، فيرى كل شخص كيف يرتبط عمله بالصورة الكاملة.
  follow:
    title: تابع التقدّم دون ملاحقة الناس
    text: التحديث يستغرق ثوانيَ. وتُشتقّ الحالة من الوقت المنقضي مقابل التقدّم المنجز، فتظهر الأهداف المتأخرة من تلقاء نفسها.
  decide:
    title: قرّر بأرقام يثق بها الجميع
    text: تغذّي الأهداف والمؤشرات والمبادرات تقارير قابلة للطباعة وملفات CSV لاجتماعات الإدارة.

showcase:
  first:
    title: أهداف تتجمّع صعودًا، ونتائج رئيسية تتحرّك
    text: قسِّم هدف المؤسسة إلى أهداف للفرق، وقِس كل هدف بنتائج رئيسية، وراقب التقدّم وهو يتجمّع تلقائيًا.
    a: شجرة مواءمة من المؤسسة نزولًا إلى كل فريق
    b: نتائج رئيسية موزونة بقيمة بداية ومستهدف
    c: حالة مشتقّة من التقويم بحدود يمكنك تعديلها
    alt: صفحة هدف مع نتائجه الرئيسية وسجلّ التقدّم
  second:
    title: مبادرات بخارطة طريق تُقرأ بنظرة واحدة
    text: حوّل الأهداف إلى مبادرات لها مسؤولون ومعالم وتواريخ، ثم تابعها على لوحة أو على جدول زمني.
    a: "لوحة حسب الوضع: مخطَّطة ونشطة ومعلَّقة ومكتملة"
    b: خارطة طريق بالمعالم وعلامة لليوم الحالي
    c: كل مبادرة مرتبطة بالأهداف التي تدعمها
    alt: خارطة طريق المبادرات مع المعالم

features:
  title: كل ما يحتاجه التخطيط، دون زيادة
  text: ابدأ بالوحدات الأساسية وفعّل فقط ما تستعمله مؤسستك.
  okr:
    title: الأهداف والنتائج الرئيسية
    text: أهداف ونتائج رئيسية وأوزان ودورات، مع تقدّم يتجمّع عبر المستويات.
  kpi:
    title: المؤشرات
    text: تابع مؤشرات الأداء الرئيسية شهرًا بشهر مقابل مستهدف، مع خط اتجاه وجدول خلف كل رسم.
  initiatives:
    title: المبادرات والمعالم
    text: "تولَّ العمل وراء كل هدف: تواريخ ومعالم وحالة وتحديثات منتظمة."
  map:
    title: خريطة الاستراتيجية
    text: ضع الأهداف على منظورات بطاقة الأداء المتوازن الأربعة، وارسم العلاقة السببية بينها.
  modular:
    title: وحدات قابلة للتركيب
    text: يمكن تفعيل الوحدات أو تعطيلها أو إضافة وحدات جديدة دون المساس ببقية المنتج.
  lang:
    title: عربية أولاً
    text: واجهة عربية حقيقية من اليمين إلى اليسار، بمصطلحات إدارية مدقَّقة.

