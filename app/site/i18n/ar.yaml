hero:
  title: أهداف واضحة ونتائج قابلة للمتابعة
  text: أنشئ أهداف المؤسسة والأقسام، وحدّد نتائج رئيسية ومؤشرات قابلة للقياس، وتابع المبادرات والتقدّم من مساحة عمل واحدة.
