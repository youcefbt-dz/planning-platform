  eyebrow: الخطوة التالية تبدأ من مساحة واضحة
  title: اجمع التخطيط والمتابعة في مكان واحد.
  text: أنشئ مساحة لمؤسستك وابدأ بتحديد اتجاهها، ثم أضف أهدافك وبياناتك ومؤشراتك خطوةً بخطوة.
  cta: أنشئ مساحة عملك
