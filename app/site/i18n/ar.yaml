workflow:
  eyebrow: آلية العمل
  title: الخطة ليست ملفًا منفصلًا عن التنفيذ.
  text: تبدأ المنصة من فهم ما تريد المؤسسة الوصول إليه، ثم تربط الأهداف بالقياس والبيانات، حتى تصبح المتابعة جزءًا طبيعيًا من العمل.
  direction:
    title: وضّح الاتجاه
    text: سجّل الرؤية والرسالة والقيم، لتكون نقطة انطلاق مشتركة لما تختاره المؤسسة من أهداف.
    foot: الرؤية · الرسالة · القيم
  goals:
    title: حوّل الاتجاه إلى أهداف
    text: أنشئ أهدافًا ونتائج رئيسية بمسؤولين ودورات، وتابع مواءمتها عبر المؤسسة ووحداتها التنظيمية.
    foot: أهداف · نتائج رئيسية · دورات
  data:
    title: اربط الخطة ببياناتك
    text: استورد ملفات المؤسسة، وحوّل الأعمدة المفهومة إلى سلاسل ومؤشرات تساعدك على قياس التقدّم واختبار واقعية المستهدفات.
    foot: Excel · مؤشرات · سلاسل زمنية
  map:
    title: اقرأ صورة المؤسسة
    text: اجمع الأهداف ومؤشراتها في مخطط واحد، واكشف مواضع التقدّم والفجوات وما يستحق المراجعة.
    foot: مخطط المؤسسة · الفجوات
  reports:
    title: شارك صورة واضحة
    text: اعرض تقدّم الأهداف والمؤشرات في تقارير قابلة للطباعة، أو صدّر البيانات بصيغة CSV لمزيد من التحليل.
    foot: تقارير · طباعة · CSV

showcase:
  link: ابدأ باستخدام مساحة عملك
  goals:
    eyebrow: متابعة الأهداف
    title: لا تكتفِ بنسبة التقدّم؛ افهم المسار خلفها.
    text: كل هدف يجمع نتائجه الرئيسية وتقدّمها ومسؤولها ووحدته ودورته. وتساعد المقارنة بين الوتيرة المتوقعة والإنجاز الفعلي على إظهار ما يسير كما خُطّط وما يحتاج إلى تدخل.
    one: تقدّم فعلي إلى جوار المتوقّع بحسب الوقت المنقضي.
    two: نتائج رئيسية بقيم بداية ومستهدفات وأوزان.
    three: تحديثات دورية توضّح ما تغيّر وما يحتاج إلى دعم.
    caption: هدف ونتائجه الرئيسية
    alt: شاشة هدف تعرض نسبة التقدّم والنتائج الرئيسية والمسؤول والوحدة التنظيمية
  data:
    eyebrow: بيانات الواقع
    title: اجعل بيانات المؤسسة جزءًا من التخطيط.
    text: ارفع ملفات Excel، راجع طريقة قراءة الأعمدة، ثم اربط البيانات بالمؤشرات والنتائج. هكذا لا تبقى الأرقام في ملف منفصل عن القرارات التي يفترض أن تدعمها.
    one: استيراد ملفات البيانات ومراجعة محتواها.
    two: تعيين الأعمدة وربط القيم بسلاسل زمنية.
    three: مقارنة المستهدفات بتاريخ الأداء وشرح الفجوات.
    caption: من ملف البيانات إلى مؤشر قابل للمتابعة
    kicker: تحليل بيانات المؤسسة
    visual_title: مصدر بيانات
    badge: جاهز للمراجعة
    file_name: بيانات الأداء.xlsx
    file_note: أعمدة وقيم قابلة للربط
