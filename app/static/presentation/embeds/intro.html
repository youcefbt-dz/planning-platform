<!doctype html><meta charset=utf-8><style>html,body{margin:0;width:1920px;height:1080px;background:transparent;overflow:hidden}svg{position:absolute;left:0;top:0}</style>
<svg width="1920" height="1080" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg"><g id="amb"></g></svg>
<script>
var NS='http://www.w3.org/2000/svg';
function E(t,a,p){var e=document.createElementNS(NS,t);for(var k in a)e.setAttribute(k,a[k]);if(p)p.appendChild(e);return e}
var seed=7;function R(){seed=(seed*16807)%2147483647;return seed/2147483647}
var amb=document.getElementById('amb'),ad=[];
for(var i=0;i<70;i++)ad.push({c:E('circle',{cx:R()*1920,cy:R()*1080,r:1+R()*2,fill:'#DDE1FF'},amb),ph:R()*6.28,sp:.6+R()});
function ambient(t){for(var i=0;i<ad.length;i++){var d=ad[i];d.c.setAttribute('opacity',(.1+.3*(.5+.5*Math.sin(t*d.sp+d.ph))).toFixed(3))}}
var T0=null;function loop(n){if(T0===null)T0=n;ambient((n-T0)/1000);requestAnimationFrame(loop)}
requestAnimationFrame(loop);
</script>
