  rl[i].setAttribute('x1',(364.5+c*r1).toFixed(1));rl[i].setAttribute('y1',(57.5+s*r1).toFixed(1));rl[i].setAttribute('x2',(364.5+c*r2).toFixed(1));rl[i].setAttribute('y2',(57.5+s*r2).toFixed(1));rl[i].setAttribute('opacity',(p>0?.9*(1-p):0).toFixed(3))}
