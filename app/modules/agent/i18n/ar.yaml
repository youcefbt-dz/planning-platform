widget_status_off: يعمل بدليل الموقع المدمج
hello_t: "أهلًا بك، أنا {name}"
hello: أرافقك في رحلة التخطيط. أشرح لك أي جزء من الموقع خطوة بخطوة، وأقرأ أهدافك وبياناتك لأخبرك أين تتأخر، وأتحدث معك في أي موضوع يخطر ببالك. لا أُنشئ أو أعدّل شيئًا قبل اعتمادك.
hello_tip: ابدأ بأحد الأسئلة أدناه أو اكتب سؤالك.
teaser: "مرحبًا، أنا {name}. اسألني عن أي شيء."
teaser_close: إخفاء الرسالة
ph: اسألني عن الموقع أو أهدافك أو أي شيء…
