# وحدة المساعد (تُضاف البادئة "agent." تلقائيًا).
module: المساعد
sub: اسأل عن الأهداف والنتائج والمؤشرات، واطلب تحليلًا أو مسودات تراجعها قبل الاعتماد.
tabs:
  chat: المساعد
widget_title: مساعد التخطيط
widget_close: إغلاق نافذة المساعد
widget_hint: استفسر عن الأهداف والنتائج الرئيسية ومؤشرات الأداء.
hello_t: ما الذي تريد مراجعته؟
hello: يمكنني تلخيص حالة الأهداف، وفحص المستهدفات استنادًا إلى البيانات السابقة، وصياغة أهداف مقترحة. لا أُنشئ أو أعدّل شيئًا قبل اعتمادك.
ph: اكتب سؤالك أو طلبك…
send: إرسال
note: تُستمد الأرقام من بيانات مساحة العمل، وتُراجع قبل إدراجها في الإجابة.
voice:
  listen: استمع إلى الإجابة
  stop: إيقاف الصوت
  auto_on: إيقاف القراءة التلقائية
  auto_off: تشغيل القراءة التلقائية
  unavailable: لا يتوفر صوت عربي مناسب على هذا المتصفح. تحقق من الأصوات المثبتة في الجهاز.
draft: مسودة بانتظار اعتمادك
serves: يخدم
from_data: يُقاس من بياناتك
manual: يُحدَّث يدويًا
warn: يتجاوز المستهدف المقترح نطاق الأداء السابق. راجعه قبل اعتماد الهدف.
approve: اعتمد وأنشئ الهدف
approve_hint: يُنشأ الهدف في القسم المحدد ويُسند إليك مسؤولية متابعته.
approving: جارٍ الإنشاء…
open_goal: فتح الهدف
unverified: أرقام لا تتوفر لها بيانات تحقق في مساحة العمل
starter:
  health: النتائج المتأخرة
  health_q: اعرض النتائج الرئيسية خارج المسار، ورتّبها حسب مقدار التأخر واذكر سبب كل حالة.
  targets: مراجعة واقعية المستهدفات
  targets_q: قارن المستهدفات الحالية بالسجل التاريخي، وحدّد النتائج التي تتطلب مراجعة.
  gaps: الأقسام التي لا تملك أهدافًا
  gaps_q: حدّد الأقسام التي لا تملك أهدافًا، والأقسام التي تتأخر نتائجها، واقترح إجراءً لكل حالة.
  suggest: صياغة أهداف مقترحة
  suggest_q: اقترح أهدافًا مرتبطة بالمؤشرات المتاحة، واعرض مستهدفات تستند إلى السجل التاريخي.
  data: ملخص مؤشرات الأداء
  data_q: لخّص المؤشرات المعتمدة، وبيّن التغيرات الإيجابية والسلبية والفروع الأكثر مساهمة فيها.
reads_t: ما الذي يقرؤه
reads:
  goals: الأهداف ونتائجها الرئيسية وحالتها
  units: الأقسام ورؤساؤها
  data: تاريخ المقاييس التي رفعتها
  targets: مقارنة المستهدفات بالأداء التاريخي
never_t: ما لا يفعله
never:
  write: لا ينشئ ولا يعدّل شيئًا دون اعتمادك
  numbers: لا يكتب رقمًا لم تُرجعه أداة
  share: لا يرى إلا ما تراه أنت في المؤسسة
off:
  consent_t: النموذج غير مسموح به بعد
  consent: يتطلب المساعد نموذجًا سحابيًا، ولم تسمح المؤسسة بإرسال البيانات اللازمة إليه. يمكنك تفعيل الموافقة أو إعداد نموذج محلي.
  allow: أوافق على استخدام النموذج
  none_t: لا يوجد نموذج مضبوط
  none: لم يُضبط مزوّد نموذج بعد. أضف إعدادات Groq أو Claude أو Grok، أو اربط نموذجًا محليًا. ستظل الملخصات المحسوبة متاحة حتى الإعداد.
  demo_t: النسخة التجريبية
  demo: المساعد غير متاح لزوّار النسخة التجريبية.
  quota_t: بلغت الحد اليومي
  quota: وصلت المؤسسة إلى الحد اليومي لطلبات النموذج. تُستخدم القواعد المدمجة حتى يتجدد الحد أو يرفعه المسؤول.
  error_t: تعذّر الوصول إلى النموذج
  error: لم يستجب النموذج؛ عُرض ملخص محسوب من بيانات المؤسسة بدلًا من الإجابة.
  go_settings: إعدادات الذكاء الاصطناعي
brief:
  counts: 'من أصل {total} نتيجة رئيسية، هناك {on} على المسار و{risk} معرّضة للخطر و{off} خارج المسار.'
  item: '{goal} — {kr}: القيمة الحالية {now}، والمستهدف {target}، والحالة {status}.'
err:
  empty: اكتب سؤالك أولًا.
  failed: تعذّر إكمال الطلب. حاول مرة أخرى.
  incomplete: لم يكتمل التحليل ضمن الوقت المتاح. حدّد مؤشرًا أو هدفًا واحدًا في السؤال.

