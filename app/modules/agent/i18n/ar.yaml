  needs_model: هذا السؤال يحتاج إلى النموذج الذكي وهو غير متاح الآن، ولا أريد أن أجيبك بتخمين. لكنني أستطيع أن أشرح لك أي جزء من الموقع، مثل إنشاء هدف أو رفع البيانات أو دعوة الفريق.
err:
  empty: اكتب سؤالك أولًا.
  failed: تعذّر إكمال الطلب. حاول مرة أخرى.
  incomplete: لم يكتمل التحليل ضمن الوقت المتاح. حدّد مؤشرًا أو هدفًا واحدًا في السؤال.

