clear: محادثة جديدة
copy: نسخ الإجابة
copied: نُسخت
note: تُراجع أرقام مؤسستك قبل أن تراها. وقد يخطئ المساعد في الأمور العامة، فتحقق مما يبنى عليه قرار مهم.
