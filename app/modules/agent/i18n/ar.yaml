# وحدة المساعد (تُضاف البادئة "agent." تلقائيًا).
# المساعد يحمل اسم الموقع (من config/brand.yaml) ويتصرف كصديق رحلة: يشرح الموقع، ويقرأ أهدافك وبياناتك، ويتحدث معك في أي موضوع.
module: المساعد
sub: اسأل عن الموقع أو أهدافك أو أي موضوع آخر، واطلب تحليلًا أو مسودات تراجعها قبل الاعتماد.
tabs:
