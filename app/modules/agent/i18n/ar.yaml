  write: لا ينشئ ولا يعدّل شيئًا دون اعتمادك
  numbers: لا يكتب رقمًا لم تُرجعه أداة
  share: لا يرى إلا ما تراه أنت في المؤسسة
"off":
  consent_t: النموذج غير مسموح به بعد
  consent: يتطلب المساعد نموذجًا سحابيًا، ولم تسمح المؤسسة بإرسال البيانات اللازمة إليه. يمكنك تفعيل الموافقة أو إعداد نموذج محلي. وفي هذه الأثناء أجيب عن أسئلتك حول الموقع من دليلي المدمج.
  allow: أوافق على استخدام النموذج
  none_t: لا يوجد نموذج مضبوط
  none: لم يُضبط مزوّد نموذج بعد. أضف إعدادات Groq أو Claude أو Grok، أو اربط نموذجًا محليًا. وفي هذه الأثناء أجيب عن أسئلتك حول الموقع من دليلي المدمج، وتظل الملخصات المحسوبة متاحة.
  demo_t: النسخة التجريبية
  demo: المساعد الكامل غير متاح لزوّار النسخة التجريبية، لكنني أجيب عن أسئلتك حول الموقع من دليلي المدمج.
  quota_t: بلغت الحد اليومي
  quota: وصلت المؤسسة إلى الحد اليومي لطلبات النموذج. تُستخدم القواعد المدمجة حتى يتجدد الحد أو يرفعه المسؤول.
  error_t: تعذّر الوصول إلى النموذج
  error: لم يستجب النموذج؛ عُرض ما أمكن من دليل الموقع أو من ملخص محسوب من بيانات المؤسسة بدلًا من الإجابة.
  go_settings: إعدادات الذكاء الاصطناعي
  guide_note: أجبتُ من دليل الموقع المدمج. لتحليل أهدافك وبياناتك والحديث في أي موضوع، يلزم تفعيل النموذج الذكي.
brief:
