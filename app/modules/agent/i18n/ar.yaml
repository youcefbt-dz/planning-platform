  health_q: اعرض النتائج الرئيسية خارج المسار، ورتّبها حسب مقدار التأخر واذكر سبب كل حالة.
  targets: مراجعة واقعية المستهدفات
  targets_q: قارن المستهدفات الحالية بالسجل التاريخي، وحدّد النتائج التي تتطلب مراجعة.
  gaps: الأقسام التي لا تملك أهدافًا
  gaps_q: حدّد الأقسام التي لا تملك أهدافًا، والأقسام التي تتأخر نتائجها، واقترح إجراءً لكل حالة.
  suggest: صياغة أهداف مقترحة
  suggest_q: اقترح أهدافًا مرتبطة بالمؤشرات المتاحة، واعرض مستهدفات تستند إلى السجل التاريخي.
  data: ملخص مؤشرات الأداء
  data_q: لخّص المؤشرات المعتمدة، وبيّن التغيرات الإيجابية والسلبية والفروع الأكثر مساهمة فيها.
reads_t: ما الذي يقرؤه
