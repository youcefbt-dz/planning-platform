map:
  title: خريطة الاستراتيجية
  sub: يعرض أهداف المؤسسة ضمن المنظورات الأربعة لبطاقة الأداء المتوازن، ويوضح علاقات التأثير بينها.
  lane_empty: لا توجد أهداف مرتبطة بهذا المنظور. حدّد المنظور من إعدادات الهدف.
  unassigned:
    zero: كل الأهداف العليا لها منظور.
    one: هدف واحد بلا منظور ولا يظهر هنا. حدّد منظوره من إعداداته.
    two: هدفان بلا منظور ولا يظهران هنا. حدّد منظورهما من إعداداتهما.
    few: "{n} أهداف بلا منظور ولا تظهر هنا. حدّد منظورها من إعداداتها."
    many: "{n} هدفًا بلا منظور ولا تظهر هنا. حدّد منظورها من إعداداتها."
    other: "{n} هدف بلا منظور ولا تظهر هنا. حدّد منظورها من إعداداتها."
  add_link: إضافة علاقة سبب وأثر
  from: من (السبب)
  to: إلى (الأثر)
  note: يشير السهم من الهدف الأول إلى الهدف الثاني إلى أن تحقيق الأول يدعم تحقيق الثاني.
